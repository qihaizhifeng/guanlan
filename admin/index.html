<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理 · 观澜</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans SC","PingFang SC",sans-serif;background:#f8f6f3;color:#2c2c2c;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.login-box{background:#fff;border:1px solid #d0cecb;border-radius:8px;padding:2.5rem 2rem;width:360px;max-width:100%;text-align:center}
.login-box h1{font-family:"Noto Serif SC",serif;font-size:1.3rem;margin-bottom:0.3rem}
.login-box p{color:#888;font-size:0.8rem;margin-bottom:1.5rem}
.login-box input{width:100%;padding:0.6rem 0.8rem;border:1px solid #d0cecb;border-radius:6px;font-size:0.9rem;outline:none;transition:border 0.2s}
.login-box input:focus{border-color:#8b7355}
.login-box button{margin-top:1rem;width:100%;padding:0.6rem;background:#1a1a1a;color:#fff;border:none;border-radius:6px;font-size:0.85rem;cursor:pointer;letter-spacing:0.05em}
.login-box button:hover{opacity:0.85}
.login-error{color:#c0392b;font-size:0.8rem;margin-top:0.5rem;display:none}
.app-wrap{display:none;max-width:1000px;margin:0 auto;padding:2rem}
.app-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}
.app-header h1{font-family:"Noto Serif SC",serif;font-size:1.2rem}
.app-header a{color:#8b7355;font-size:0.8rem;text-decoration:none}
.app-header a:hover{text-decoration:underline}
.articles-list{display:flex;flex-direction:column;gap:0.5rem;margin-bottom:2rem}
.article-row{display:flex;align-items:center;gap:0.5rem;background:#fff;border:1px solid #d0cecb;border-radius:6px;padding:0.6rem 1rem;transition:border 0.2s}
.article-row:hover{border-color:#8b7355}
.article-row .info{flex:1;min-width:0}
.article-row .info .title{font-weight:600;font-size:0.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.article-row .info .meta{font-size:0.7rem;color:#888}
.article-row .tag{font-size:0.65rem;padding:0.15rem 0.5rem;border-radius:10px;background:#e8e4df;color:#4a4a4a;white-space:nowrap}
.article-row .tag.draft{background:#f0e6d0;color:#8b7355}
.article-row .actions{display:flex;gap:0.3rem}
.article-row button{background:none;border:1px solid #d0cecb;border-radius:4px;padding:0.25rem 0.5rem;font-size:0.7rem;cursor:pointer;color:#4a4a4a;transition:all 0.2s}
.article-row button:hover{border-color:#8b7355;color:#8b7355}
.article-row button.danger:hover{border-color:#c0392b;color:#c0392b}
.editor-card{background:#fff;border:1px solid #d0cecb;border-radius:8px;padding:1.5rem}
.editor-card h2{font-family:"Noto Serif SC",serif;font-size:1rem;margin-bottom:1rem}
.editor-card label{display:block;font-size:0.75rem;color:#888;margin-bottom:0.3rem}
.editor-card input,.editor-card select,.editor-card textarea{width:100%;padding:0.5rem 0.7rem;border:1px solid #d0cecb;border-radius:6px;font-size:0.85rem;font-family:inherit;outline:none;transition:border 0.2s;margin-bottom:1rem}
.editor-card input:focus,.editor-card select:focus,.editor-card textarea:focus{border-color:#8b7355}
.editor-card textarea{resize:vertical;min-height:120px}
.editor-card textarea.content-area{min-height:300px;font-family:"Noto Serif SC",serif;line-height:1.9}
.editor-card .btn-row{display:flex;gap:0.5rem;justify-content:flex-end}
.editor-card .btn-row button{padding:0.5rem 1.2rem;border-radius:6px;font-size:0.8rem;cursor:pointer;border:none;transition:opacity 0.2s}
.editor-card .btn-row .cancel{background:#e8e4df;color:#4a4a4a}
.editor-card .btn-row .save{background:#1a1a1a;color:#fff}
.editor-card .btn-row .delete{background:#c0392b;color:#fff}
.editor-card .btn-row button:hover{opacity:0.85}
@media(max-width:640px){.app-wrap{padding:1rem}.article-row{flex-wrap:wrap}}

.admin-layout{display:flex;gap:1.5rem;align-items:flex-start}
.editor-pane{flex:1;min-width:0}
.preview-pane{flex:0 0 380px;position:sticky;top:2rem}
.preview-box{background:#fff;border:1px solid #d0cecb;border-radius:8px;padding:1.5rem;min-height:300px}
.preview-box .preview-label{font-family:"Noto Serif SC",serif;font-size:0.8rem;color:#888;margin-bottom:1rem;padding-bottom:0.5rem;border-bottom:1px solid #e8e4df}
.preview-content{font-family:"Noto Serif SC",serif;line-height:1.9;color:#2c2c2c;font-size:0.9rem}
.preview-title{font-size:1.3rem;font-weight:700;margin:0 0 0.3rem;line-height:1.4}
.preview-meta{font-family:"Noto Sans SC",sans-serif;font-size:0.7rem;color:#888;margin-bottom:0.8rem}
.preview-subtitle{font-size:0.85rem;color:#4a4a4a;font-weight:300;margin-bottom:1rem}
.preview-paragraph{margin:0 0 1em;text-indent:2em}
.preview-paragraph img{max-width:100%;border-radius:4px;display:inline-block;margin:0.3em 0}
.preview-image{max-width:100%;border-radius:6px;display:block;margin:1.5em auto;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.preview-caption{text-align:center;font-size:0.75rem;color:#888;margin:-1em 0 1.5em}
.preview-empty{color:#ccc;font-size:0.85rem;text-align:center;padding:3rem 1rem}
@media(max-width:900px){.admin-layout{flex-direction:column}.preview-pane{flex:none;width:100%;position:static}}


.img-opt-label{font-size:0.75rem;padding:0.15rem 0.4rem;border:1px solid #d0cecb;border-radius:4px;cursor:pointer;transition:all 0.2s;white-space:nowrap}
.img-opt-label:has(input:checked){background:#1a1a1a;border-color:#1a1a1a;color:#fff}
.img-opt-label input{display:none}
/* preview gallery */
.preview-gallery{display:flex;gap:0.5rem;margin:1em 0;flex-wrap:wrap}
.preview-gallery .preview-image{flex:1;min-width:100px;margin:0;box-shadow:none;border-radius:4px;object-fit:cover;max-height:300px}
.preview-img-s{max-width:300px}
.preview-img-m{max-width:500px}
.preview-img-l{max-width:80%}
.preview-img-f{max-width:100%}
.preview-img-left{margin-left:0;margin-right:auto}
.preview-img-center{margin-left:auto;margin-right:auto}
.preview-img-right{margin-left:auto;margin-right:0}

.editor-toolbar{display:flex;gap:0.25rem;padding:0.4rem 0;border-bottom:1px solid #e8e4df;margin-bottom:0.5rem;flex-wrap:wrap}
.editor-toolbar button{display:inline-flex;align-items:center;justify-content:center;width:32px;height:28px;border:1px solid #e8e4df;border-radius:4px;background:#fff;color:#4a4a4a;font-size:0.75rem;cursor:pointer;transition:all 0.15s;padding:0;line-height:1}
.editor-toolbar button:hover{border-color:#8b7355;color:#8b7355;background:#faf8f6}
.editor-toolbar button b{font-weight:700}
.editor-toolbar button i{font-style:italic}
.editor-toolbar .tb-label{font-family:"Noto Sans SC",sans-serif;font-weight:500;width:auto;padding:0 0.5rem;font-size:0.7rem;color:#bbb;letter-spacing:0.05em}
.preview-h2{font-size:1.2rem;font-weight:700;margin:1.5em 0 0.5em;line-height:1.4}
.preview-h3{font-size:1rem;font-weight:600;margin:1.2em 0 0.4em;line-height:1.4}
.preview-blockquote{margin:1em 0;padding:0.5rem 1rem;border-left:3px solid #c4a882;background:#faf8f6;border-radius:0 4px 4px 0;color:#4a4a4a;font-size:0.85rem}
.preview-list{margin:0.5em 0;padding-left:1.2em;font-size:0.85rem;line-height:1.8}
.preview-link{color:#8b7355;text-decoration:underline;text-underline-offset:1px}

.admin-tabs{display:flex;gap:0;margin-bottom:1.5rem;border-bottom:1px solid #e0e0e0}
.admin-tab{padding:0.4rem 1.2rem;border:none;background:none;font-size:0.8rem;color:#888;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;font-family:"Noto Sans SC",sans-serif}
.admin-tab:hover{color:#333}
.admin-tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a}
.comments-panel{display:none;max-width:800px;margin:0 auto;padding:0 2rem 4rem}
.comments-panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem}
.comments-panel-header h3{font-family:"Noto Serif SC",serif;font-size:1rem}
.comments-filter{display:flex;gap:0.3rem}
.comments-filter-btn{font-size:0.7rem;padding:0.25rem 0.7rem;border:1px solid #d0cecb;border-radius:4px;background:#fff;color:#888;cursor:pointer;transition:all 0.2s;font-family:"Noto Sans SC",sans-serif}
.comments-filter-btn:hover{border-color:#333;color:#333}
.comments-filter-btn.active{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
.comment-mgt-item{padding:0.8rem 1rem;background:#fff;border:1px solid #e8e4df;border-radius:6px;margin-bottom:0.5rem}
.comment-mgt-item .cmt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem;margin-bottom:0.3rem}
.comment-mgt-item .cmt-article{font-size:0.7rem;color:#aaa;margin-bottom:0.2rem}
.comment-mgt-item .cmt-name{font-weight:600;font-size:0.8rem;color:#333}
.comment-mgt-item .cmt-time{font-size:0.65rem;color:#aaa}
.comment-mgt-item .cmt-content{font-size:0.8rem;color:#555;line-height:1.6;margin:0.3rem 0}
.comment-mgt-item .cmt-actions{display:flex;gap:0.3rem;margin-top:0.4rem}
.comment-mgt-item .cmt-actions button{font-size:0.7rem;padding:0.2rem 0.6rem;border:1px solid #d0cecb;border-radius:4px;background:#fff;cursor:pointer;transition:all 0.2s}
.comment-mgt-item .cmt-actions button:hover{border-color:#333}
.comment-mgt-item .cmt-actions .approve-btn:hover{background:#27ae60;color:#fff;border-color:#27ae60}
.comment-mgt-item .cmt-actions .reject-btn:hover{background:#e67e22;color:#fff;border-color:#e67e22}
.comment-mgt-item .cmt-actions .delete-btn:hover{background:#c0392b;color:#fff;border-color:#c0392b}
.comment-status-tag{font-size:0.65rem;padding:0.1rem 0.4rem;border-radius:3px}
.comment-status-tag.pending{background:#fff3cd;color:#856404}
.comment-status-tag.approved{background:#d4edda;color:#155724}
.comment-status-tag.rejected{background:#f8d7da;color:#721c24}
.pending-badge{background:#c0392b;color:#fff;font-size:0.6rem;padding:0.05rem 0.35rem;border-radius:8px;margin-left:0.2rem}
</style>
</head>
<body>
<div class="login-wrap" id="login-wrap">
  <div class="login-box">
    <h1>观澜</h1>
    <p>管理后台 · 请输入密码</p>
    <input type="password" id="password-input" placeholder="密码" autocomplete="current-password" />
    <button id="login-btn">进入管理</button>
    <p class="login-error" id="login-error">密码错误</p>
  </div>
</div>
<div class="app-wrap" id="app-wrap">
  <div class="app-header">
    <h1>管理 · 观澜</h1>
    <a href="/" target="_blank">← 查看博客</a>
  </div>
  <div class="admin-tabs">
    <button class="admin-tab active" data-tab="articles">文章</button>
    <button class="admin-tab" data-tab="comments">评论 <span id="pending-count" style="font-weight:700;color:#c0392b"></span></button>
  </div>
  <div class="admin-layout">
    <div class="editor-pane">
  <div class="articles-list" id="articles-list"></div>
  <div class="editor-card" id="editor-card">
    <h2 id="editor-title">写新文章</h2>
    <input type="hidden" id="edit-id" value="" />
    <label>标题</label>
    <input type="text" id="edit-title" placeholder="文章标题" />
    <label>副标题</label>
    <input type="text" id="edit-subtitle" placeholder="副标题（选填）" />
    <div style="display:flex;gap:1rem;flex-wrap:wrap">
      <div style="flex:1;min-width:140px">
        <label>分类</label>
        <select id="edit-category">
          <option value="随笔">随笔</option>
          <option value="书评">书评</option>
          <option value="思考">思考</option>
          <option value="摄影">摄影</option>
          <option value="记忆">记忆</option>
          <option value="日历">日历</option>
        </select>
      </div>
      <div style="flex:1;min-width:140px">
        <label>日期</label>
        <input type="text" id="edit-date" placeholder="例: 2026年7月22日" />
      </div>
      <div style="display:flex;align-items:flex-end;gap:0.5rem;padding-bottom:1rem">
        <label><input type="checkbox" id="edit-published" checked /> 已发布</label>
      </div>
    </div>
    <label>摘要</label>
    <textarea id="edit-excerpt" placeholder="文章摘要（展示在卡片上）"></textarea>
    <label>正文</label>
    <div class="editor-toolbar">
      <button title="加粗" onclick="tb('**','**',true)" class="tb-bold"><b>B</b></button>
      <button title="斜体" onclick="tb('*','*',true)" class="tb-italic"><i>I</i></button>
      <span class="tb-label">|</span>
      <button title="二级标题" onclick="tb('## ','',false,true)"><span style="font-size:0.82rem;font-weight:700">H</span><sub style="font-size:0.55rem">2</sub></button>
      <button title="三级标题" onclick="tb('### ','',false,true)"><span style="font-size:0.82rem;font-weight:700">H</span><sub style="font-size:0.55rem">3</sub></button>
      <span class="tb-label">|</span>
      <button title="引用" onclick="tb('> ','',false,true)" style="font-size:0.9rem">"</button>
      <button title="无序列表" onclick="tb('- ','',false,true)" style="font-size:0.9rem;font-weight:700">≡</button>
      <span class="tb-label">|</span>
      <button title="链接" onclick="insertLink()" style="font-size:0.85rem">🔗</button>
    </div>
    <textarea class="content-area" id="edit-content" placeholder="正文内容，空行分段&#10;&#10;插入图片: 点击下方「上传图片」按钮，选图后自动插入"></textarea>
    <div style="margin-bottom:1rem">
      <input type="file" id="image-input" accept="image/*" style="display:none" />
      <button type="button" id="upload-btn" style="padding:0.4rem 1rem;border:1px solid #d0cecb;border-radius:6px;background:#fff;color:#4a4a4a;font-size:0.8rem;cursor:pointer;transition:all 0.2s" onmouseover="this.style.borderColor='#8b7355'" onmouseout="this.style.borderColor='#d0cecb'">🖼 上传图片</button>
      <span id="upload-status" style="font-size:0.75rem;color:#888;margin-left:0.5rem"></span>
    </div>
    <div id="img-options" style="display:none;margin-bottom:1rem;padding:0.8rem;background:#f8f6f3;border-radius:6px;border:1px solid #e8e4df">
      <div style="display:flex;gap:0.8rem;align-items:flex-start;margin-bottom:0.6rem">
        <img id="img-options-preview" style="width:72px;height:72px;object-fit:cover;border-radius:4px;flex-shrink:0" />
        <div style="flex:1;min-width:0">
          <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.5rem">
            <div>
              <div style="font-size:0.7rem;color:#888;margin-bottom:0.2rem;letter-spacing:0.03em">尺寸</div>
              <div style="display:flex;gap:0.2rem;">
                <label class="img-opt-label"><input type="radio" name="img-size" value="s" /> 小</label>
                <label class="img-opt-label"><input type="radio" name="img-size" value="m" checked /> 中</label>
                <label class="img-opt-label"><input type="radio" name="img-size" value="l" /> 大</label>
                <label class="img-opt-label"><input type="radio" name="img-size" value="f" /> 原图</label>
              </div>
            </div>
            <div>
              <div style="font-size:0.7rem;color:#888;margin-bottom:0.2rem;letter-spacing:0.03em">对齐</div>
              <div style="display:flex;gap:0.2rem;">
                <label class="img-opt-label"><input type="radio" name="img-align" value="l" /> 左</label>
                <label class="img-opt-label"><input type="radio" name="img-align" value="c" checked /> 中</label>
                <label class="img-opt-label"><input type="radio" name="img-align" value="r" /> 右</label>
              </div>
            </div>
          </div>
          <div style="display:flex;gap:0.3rem">
            <button type="button" id="img-options-insert" style="padding:0.3rem 0.8rem;background:#1a1a1a;color:#fff;border:none;border-radius:4px;font-size:0.75rem;cursor:pointer">插入</button>
            <button type="button" id="img-options-cancel" style="padding:0.3rem 0.8rem;background:#e8e4df;color:#4a4a4a;border:none;border-radius:4px;font-size:0.75rem;cursor:pointer">取消</button>
          </div>
        </div>
      </div>
    </div>
    <div class="btn-row">
      <button class="cancel" id="editor-cancel">取消</button>
      <button class="save" id="editor-save">保存</button>
    </div>
  </div>
    </div>
  <div class="preview-pane">
    <div class="preview-box">
      <div class="preview-label">预览</div>
      <div class="preview-content" id="preview-content">
        <div class="preview-empty">在编辑器中输入内容，实时预览排版效果</div>
      </div>
    </div>
  </div>
</div>
<script>
let token = sessionStorage.getItem('admin_token') || ''
let editingId = null

function api(path, opts = {}) {
  const headers = { ...opts.headers }
  if (token) headers['Authorization'] = 'Bearer ' + token
  if (opts.body) {
    headers['Content-Type'] = 'application/json'
  }
  return fetch(path, { ...opts, headers }).then(r => {
    if (r.status === 401) { sessionStorage.removeItem('admin_token'); token = ''; showLogin(); return null }
    return r.json()
  })
}

function showLogin() {
  document.getElementById('login-wrap').style.display = ''
  document.getElementById('app-wrap').style.display = 'none'
}

function showApp() {
  document.getElementById('login-wrap').style.display = 'none'
  document.getElementById('app-wrap').style.display = 'block'
}

async function handleLogin() {
  const pw = document.getElementById('password-input').value
  const err = document.getElementById('login-error')
  const res = await api('/api/admin/auth', {
    method: 'POST',
    body: JSON.stringify({ password: pw }),
    headers: { 'Content-Type': 'application/json' }
  })
  if (res && res.token) {
    token = res.token
    sessionStorage.setItem('admin_token', token)
    err.style.display = 'none'
    showApp()
    loadArticles()
    updatePendingCount()
  } else {
    err.style.display = 'block'
  }
}

document.getElementById('login-btn').addEventListener('click', handleLogin)
document.getElementById('password-input').addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin() })

async function loadArticles() {
  const articles = await api('/api/admin/articles') || []
  const list = document.getElementById('articles-list')
  list.innerHTML = articles.map(a => `
    <div class="article-row" data-id="${a.id}">
      <div class="info">
        <div class="title">${a.title}</div>
        <div class="meta">${a.date} · ${a.category}</div>
      </div>
      <span class="tag${!a.published ? ' draft' : ''}">${a.published ? '已发布' : '草稿'}</span>
      <div class="actions">
        <button onclick="editArticle(${a.id})">编辑</button>
        <button class="danger" onclick="deleteArticle(${a.id})">删除</button>
      </div>
    </div>
  `).join('')
}

async function editArticle(id) {
  const articles = await api('/api/admin/articles') || []
  const a = articles.find(x => x.id === id)
  if (!a) return
  editingId = id
  document.getElementById('editor-title').textContent = '编辑文章'
  document.getElementById('edit-id').value = id
  document.getElementById('edit-title').value = a.title
  document.getElementById('edit-subtitle').value = a.subtitle || ''
  document.getElementById('edit-category').value = a.category
  document.getElementById('edit-date').value = a.date
  document.getElementById('edit-excerpt').value = a.excerpt || ''
  document.getElementById('edit-content').value = a.content || ''
  document.getElementById('edit-published').checked = a.published !== false
  document.getElementById('editor-card').scrollIntoView({ behavior: 'smooth' })
}

function resetEditor() {
  editingId = null
  document.getElementById('editor-title').textContent = '写新文章'
  document.getElementById('edit-id').value = ''
  document.getElementById('edit-title').value = ''
  document.getElementById('edit-subtitle').value = ''
  document.getElementById('edit-category').value = '随笔'
  const now = new Date()
  document.getElementById('edit-date').value = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日'
  document.getElementById('edit-excerpt').value = ''
  document.getElementById('edit-content').value = ''
  document.getElementById('edit-published').checked = true
}

document.getElementById('editor-cancel').addEventListener('click', resetEditor)

document.getElementById('editor-save').addEventListener('click', async () => {
  const data = {
    title: document.getElementById('edit-title').value,
    subtitle: document.getElementById('edit-subtitle').value,
    category: document.getElementById('edit-category').value,
    date: document.getElementById('edit-date').value,
    excerpt: document.getElementById('edit-excerpt').value,
    content: document.getElementById('edit-content').value,
    published: document.getElementById('edit-published').checked,
  }
  if (!data.title) { alert('请填写标题'); return }
  if (!data.content) { alert('请填写正文'); return }

  const res = editingId
    ? await api('/api/admin/articles/' + editingId, { method: 'PUT', body: JSON.stringify(data) })
    : await api('/api/admin/articles', { method: 'POST', body: JSON.stringify(data) })

  if (res) {
    resetEditor()
    loadArticles()
  }
})

async function deleteArticle(id) {
  if (!confirm('确定删除这篇文章？')) return
  await api('/api/admin/articles/' + id, { method: 'DELETE' })
  loadArticles()
}

// 图片上传
document.getElementById('upload-btn').addEventListener('click', () => {
  document.getElementById('image-input').click()
})

let lastUploadUrl = ''

document.getElementById('image-input').addEventListener('change', async (e) => {
  const file = e.target.files[0]
  if (!file) return
  const status = document.getElementById('upload-status')
  status.textContent = '上传中...'
  document.getElementById('img-options').style.display = 'none'
  
  const formData = new FormData()
  formData.append('image', file)
  
  try {
    const res = await fetch('/api/admin/upload', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token },
      body: formData,
    })
    if (!res.ok) {
      const text = await res.text()
      status.textContent = '❌ HTTP ' + res.status + ': ' + text.substring(0, 80)
      return
    }
    const data = await res.json()
    if (data.url) {
      lastUploadUrl = data.url
      document.getElementById('img-options-preview').src = data.url
      document.getElementById('img-options').style.display = ''
      status.textContent = '✅ 已上传，选择尺寸和对齐后点击「插入」'
      // Reset to defaults
      document.querySelector('input[name="img-size"][value="m"]').checked = true
      document.querySelector('input[name="img-align"][value="c"]').checked = true
    } else {
      status.textContent = '❌ ' + (data.error || '上传失败')
    }
  } catch (err) {
    status.textContent = '❌ 网络错误: ' + err.message
  }
  
  e.target.value = ''
  // Clear status after 8s
  setTimeout(() => { if (!status.textContent.includes('✅')) status.textContent = '' }, 8000)
})

document.getElementById('img-options-insert').addEventListener('click', () => {
  if (!lastUploadUrl) return
  const size = document.querySelector('input[name="img-size"]:checked')?.value || 'm'
  const align = document.querySelector('input[name="img-align"]:checked')?.value || 'c'
  const textarea = document.getElementById('edit-content')
  const cursor = textarea.selectionStart
  const before = textarea.value.substring(0, cursor)
  const after = textarea.value.substring(cursor)
  textarea.value = before + '![](' + lastUploadUrl + ' "' + size + ' ' + align + '")' + after
  document.getElementById('img-options').style.display = 'none'
  document.getElementById('upload-status').textContent = '✅ 已插入'
  // Trigger preview update
  textarea.dispatchEvent(new Event('input'))
  setTimeout(() => { document.getElementById('upload-status').textContent = '' }, 3000)
})

document.getElementById('img-options-cancel').addEventListener('click', () => {
  document.getElementById('img-options').style.display = 'none'
  document.getElementById('upload-status').textContent = ''
})

function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
function renderPreviewBlock(text){
  if(text.startsWith('## ')) return '<div class="preview-h2">'+renderInlineMarkdown(text.slice(3))+'</div>'
  if(text.startsWith('### ')) return '<div class="preview-h3">'+renderInlineMarkdown(text.slice(4))+'</div>'
  if(text.startsWith('> ')) return '<div class="preview-blockquote">'+renderInlineMarkdown(text.slice(2))+'</div>'
  if(text.startsWith('- ')||text.startsWith('* ')) return '<li>'+renderInlineMarkdown(text.slice(2))+'</li>'
  return '<div class="preview-paragraph">'+renderInlineMarkdown(text)+'</div>'
}
function renderPreviewParagraphs(ps){
  let html='',i=0
  while(i<ps.length){
    // Check for image gallery (consecutive images)
    const imgIdx=i
    while(i<ps.length&&ps[i].match(/^!\[(.*?)\]\((.*?)\)/))i++
    if(i-imgIdx>=2){
      html+='<div class="preview-gallery">'
      for(let j=imgIdx;j<i;j++)html+=renderPreviewImage(ps[j])
      html+='</div>'
      continue
    }
    i=imgIdx
    const m=ps[i].match(/^!\[(.*?)\]\((.*?)\)/)
    if(m){html+=renderPreviewImage(ps[i]);i++;continue}
    const listStart=i
    while(i<ps.length&&(ps[i].startsWith('- ')||ps[i].startsWith('* ')))i++
    if(i-listStart>=1){
      html+='<ul class="preview-list">'
      for(let j=listStart;j<i;j++)html+=renderPreviewBlock(ps[j])
      html+='</ul>'
      continue
    }
    i=listStart
    html+=renderPreviewBlock(ps[i])
    i++
  }
  return html
}
function renderPreviewImage(text){
  const m=text.match(/^!\[(.*?)\]\((.*?)(?:\s+"(.*?)")?\)$/)
  if(!m)return ''
  const alt=escapeHtml(m[1]),url=m[2]
  const opts=m[3]||'l c'
  const parts=opts.split(' ')
  let size=parts[0]||'l',align=parts[1]||'c'
  let cls='preview-image preview-img-'+size+' preview-img-'+align
  return '<img class="'+cls+'" src="'+url+'" alt="'+alt+'" loading="lazy" /><div class="preview-caption">'+alt+'</div>'
}
function tb(before, after, useSelection, lineStart){
  const ta=document.getElementById('edit-content')
  const start=ta.selectionStart,end=ta.selectionEnd
  if(lineStart){
    const lineStartIdx=ta.value.lastIndexOf('\n',start-1)+1
    ta.value=ta.value.substring(0,lineStartIdx)+before+ta.value.substring(lineStartIdx)
  }else if(useSelection&&end>start){
    const sel=ta.value.substring(start,end)
    ta.value=ta.value.substring(0,start)+before+sel+after+ta.value.substring(end)
  }else{
    ta.value=ta.value.substring(0,start)+before+after+ta.value.substring(end)
  }
  ta.focus()
  ta.dispatchEvent(new Event('input'))
}
function insertLink(){
  const ta=document.getElementById('edit-content')
  const start=ta.selectionStart,end=ta.selectionEnd
  if(end>start){
    const sel=ta.value.substring(start,end)
    ta.value=ta.value.substring(0,start)+'['+sel+'](url)'+ta.value.substring(end)
  }else{
    ta.value=ta.value.substring(0,start)+'[链接文字](url)'+ta.value.substring(end)
  }
  ta.focus()
  ta.dispatchEvent(new Event('input'))
}
function renderInlineMarkdown(text){
  text=text.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
  text=text.replace(/\*(.+?)\*/g,'<em>$1</em>')
  text=text.replace(/\[(.+?)\]\((.*?)\)/g,'<a class="preview-link" href="$2">$1</a>')
  text=text.replace(/!\[(.*?)\]\((.*?)\)/g,'<img src="$2" alt="$1" style="max-width:100%;border-radius:4px;margin:0.3em 0" />')
  return text
}
function updatePreview(){
  const title=document.getElementById('edit-title').value
  const subtitle=document.getElementById('edit-subtitle').value
  const date=document.getElementById('edit-date').value
  const category=document.getElementById('edit-category').value
  const content=document.getElementById('edit-content').value
  const preview=document.getElementById('preview-content')
  let html=''
  if(title||subtitle||content){
    if(title)html+='<div class="preview-title">'+escapeHtml(title)+'</div>'
    if(date||category)html+='<div class="preview-meta">'+escapeHtml(category)+' · '+escapeHtml(date)+'</div>'
    if(subtitle)html+='<div class="preview-subtitle">'+escapeHtml(subtitle)+'</div>'
    if(content){
      const ps=content.split('\n\n').map(p=>p.trim()).filter(Boolean)
      html+=renderPreviewParagraphs(ps)
    }
  }else{
    html='<div class="preview-empty">在编辑器中输入内容，实时预览排版效果</div>'
  }
  preview.innerHTML=html
}
document.getElementById('edit-title').addEventListener('input',updatePreview)
document.getElementById('edit-subtitle').addEventListener('input',updatePreview)
document.getElementById('edit-date').addEventListener('input',updatePreview)
document.getElementById('edit-category').addEventListener('change',updatePreview)
document.getElementById('edit-content').addEventListener('input',updatePreview)

let adminCommentStatus = ''

async function loadAdminComments(status) {
  adminCommentStatus = status || document.querySelector('.comments-filter-btn.active')?.dataset?.status || 'pending'
  const list = document.getElementById('comments-list')
  list.innerHTML = '<div class="comments-empty">加载中...</div>'
  const url = '/api/admin/comments' + (adminCommentStatus ? '?status=' + adminCommentStatus : '')
  const data = await api(url)
  if (!data || data.length === 0) {
    list.innerHTML = '<div class="comments-empty">无评论</div>'
    return
  }
  list.innerHTML = data.map(c => {
    const statusTag = '<span class="comment-status-tag ' + c.status + '">' + statusLabel(c.status) + '</span>'
    const actions = c.status === 'pending'
      ? '<button class="approve-btn" onclick="updateComment(' + c.id + ','approved')">通过</button><button class="reject-btn" onclick="updateComment(' + c.id + ','rejected')">拒绝</button><button class="delete-btn" onclick="deleteComment(' + c.id + ')">删除</button>'
      : '<button class="delete-btn" onclick="deleteComment(' + c.id + ')">删除</button>'
    return '<div class="comment-mgt-item">' +
      '<div class="cmt-article">' + escapeHtml(c.article_title || '') + '</div>' +
      '<div class="cmt-top">' +
        '<div><span class="cmt-name">' + escapeHtml(c.name) + '</span> <span class="cmt-time">' + (c.created_at || '').substring(0, 10) + '</span></div>' +
        statusTag +
      '</div>' +
      '<div class="cmt-content">' + escapeHtml(c.content) + '</div>' +
      '<div class="cmt-actions">' + actions + '</div>' +
    '</div>'
  }).join('')
}

function statusLabel(s) {
  return s === 'approved' ? '已通过' : s === 'rejected' ? '已拒绝' : '待审核'
}

async function updateComment(id, status) {
  const res = await api('/api/admin/comments/' + id, { method: 'PUT', body: JSON.stringify({ status }) })
  if (res) loadAdminComments(adminCommentStatus)
}

async function deleteComment(id) {
  if (!confirm('确定删除该评论？')) return
  const res = await api('/api/admin/comments/' + id, { method: 'DELETE' })
  if (res) loadAdminComments(adminCommentStatus)
}
